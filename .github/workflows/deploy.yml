name: Deploy demo storefront to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build storefront
        run: npm run build --workspace frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Configure GitHub Pages route fallback
        run: |
          node --input-type=module -e "import { readFile, writeFile } from 'node:fs/promises'; const path = 'frontend/dist/404.html'; const html = await readFile(path, 'utf8'); await writeFile(path, html.replaceAll('__BASE_PATH__', process.env.PAGES_BASE_PATH));"
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
