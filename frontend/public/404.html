<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Returning to Evergreen…</title>
    <script>
      (function () {
        var basePath = '__BASE_PATH__';
        var path = window.location.pathname;
        if (!path.startsWith(basePath)) return;
        var route = path.slice(basePath.length) + window.location.search + window.location.hash;
        var destination = new URL(basePath, window.location.origin);
        destination.searchParams.set('__pages_route', route);
        window.location.replace(destination.href);
      })();
    </script>
  </head>
  <body></body>
</html>
